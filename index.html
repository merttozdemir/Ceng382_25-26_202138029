<!DOCTYPE html>
<html>
<head>
<title>Website Theme</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <div class="login">
            <h1>WANTED</h1>
            <h2>For crimes against the Wild West</h2>
            <h3>REWARD: $10,000</h3>
            <input type="text" name="Uname" placeholder="Outlaw NickName">
            <input type="password" name="password" placeholder="Outlaw Password"><br>
            <button class="btn">Login</button>
        </div>
        <!-- I found this svg part from a youtube video and adjust it for my code -->
        <svg viewBox="0 0 100 100">
            <defs>
                <mask id ="cylinderMask">
                    <rect width = "100" height="100" fill = "white"/>
        
                    <circle cx="50" cy="15" r="12.5"/>
                    <circle cx="50" cy="15" r="12.5" transform-origin = "50 50" transform = "rotate(60)"/>
                    <circle cx="50" cy="15" r="12.5" transform-origin = "50 50" transform = "rotate(120)"/>
                    <circle cx="50" cy="15" r="12.5" transform-origin = "50 50" transform = "rotate(180)"/>
                    <circle cx="50" cy="15" r="12.5" transform-origin = "50 50" transform = "rotate(240)"/>
                    <circle cx="50" cy="15" r="12.5" transform-origin = "50 50" transform = "rotate(300)"/>
        
                    <ellipse cx="50" cy="-7.5" rx="12" transform-origin = "50 50" transform = "rotate(30)"/>
                    <ellipse cx="50" cy="-7.5" rx="12" transform-origin = "50 50" transform = "rotate(90)"/>
                    <ellipse cx="50" cy="-7.5" rx="12" transform-origin = "50 50" transform = "rotate(150)"/>
                    <ellipse cx="50" cy="-7.5" rx="12" transform-origin = "50 50" transform = "rotate(210)"/>
                    <ellipse cx="50" cy="-7.5" rx="12" transform-origin = "50 50" transform = "rotate(270)"/>
                    <ellipse cx="50" cy="-7.5" rx="12" transform-origin = "50 50" transform = "rotate(330)"/>
                    
                    <circle cx="50" cy="50" r= "10"/>
                    <circle cx="50" cy="50" r= "5" fill= " white"/>
                </mask>
            </defs>
            <g class="icon">
                <circle cx = "50" cy= "50" r= "50" mask="url(#cylinderMask)"/>
        
                <circle class="round round-1" cx="50" cy="15" r="10"/>
                <circle class="round round-2" cx="50" cy="15" r="10" transform-origin="50 50" transform="rotate(60)"/>
                <circle class="round round-3" cx="50" cy="15" r="10" transform-origin="50 50" transform="rotate(120)"/>
                <circle class="round round-4" cx="50" cy="15" r="10" transform-origin="50 50" transform="rotate(180)"/>
                <circle class="round round-5" cx="50" cy="15" r="10" transform-origin="50 50" transform="rotate(240)"/>
                <circle class="round round-6" cx="50" cy="15" r="10" transform-origin="50 50" transform="rotate(300)"/>
            </g>
        </svg>
        <div class="clock">
            <h1 id="current-time">12:00:00</h1>
        </div>
    </div>
    <!--I took this part from chatgpt-->
    <script>
        document.addEventListener("keydown",function(event){
            if(event.key.toLowerCase() === "h"){
                let div = document.querySelector(".login");
                if(div){
                    div.classList.toggle("hidden");
                }
            }
        })
    </script>
    <script>
        let time = document.getElementById("current-time");
        
        setInterval(()=>{
            let d = new Date();
            time.innerHTML = d.toLocaleTimeString();
        },1000)
    </script>
</body>
</html>
